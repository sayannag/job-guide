<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Guide — Analytical & QC careers in Kolkata and Bangalore</title>
  <meta name="description" content="A role-based career field guide for residue analysts and QC chemists (LC-MS/MS, GC-MS/MS) in Kolkata and Bangalore, with a secondary creative track in interior design.">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css?v=2026-10-12.4">
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('fg.theme') || 'null');
        var theme = saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body data-track="site">
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Field Guide home">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M16 6.5 19.2 16 16 25.5 12.8 16Z" fill="currentColor" opacity=".9"/>
        <circle cx="16" cy="16" r="1.6" fill="var(--bg)"/>
      </svg>
      <span class="brand__text">Field Guide</span>
    </a>

    <nav class="tabs" aria-label="Tracks">
      <a href="#/analytical" data-tab="analytical">Analytical<span class="tab__long"> &amp; QC</span></a>
      <a href="#/creative" data-tab="creative">Interior<span class="tab__long"> &amp; Creative</span></a>
    </nav>

    <div class="top-actions">
      <button class="search-btn" type="button" data-search-open aria-label="Search the guide">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="search-btn__label">Search</span>
        <kbd>/</kbd>
      </button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="main" tabindex="-1">
      <p class="loading">Loading the guide…</p>
      <noscript><p>This guide needs JavaScript. Please enable it, or open the files in the <code>content/</code> folder directly.</p></noscript>
    </main>
  </div>

  <footer class="footer">
    <div class="footer__inner">
      <span>Field Guide · role-based career notes for Kolkata, Bangalore &amp; remote</span>
      <span id="footer-updated"></span>
      <a href="#/about">About &amp; how to update</a>
    </div>
  </footer>

  <div class="search" id="search" hidden>
    <div class="search__panel" role="dialog" aria-modal="true" aria-label="Search the guide">
      <input class="search__input" id="search-input" type="search" placeholder="Search roles, topics, employers, interview questions…" autocomplete="off" spellcheck="false">
      <ul class="search__results" id="search-results" role="listbox"></ul>
      <div class="search__hint"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
    </div>
  </div>

  <!-- All guide content lives in /content. The manifest lists which files to load.
       After editing, bump ?v= here and `version` in content/manifest.js so browsers fetch fresh files. -->
  <script src="content/manifest.js?v=2026-10-12.4"></script>
  <script src="assets/js/app.js?v=2026-10-12.4"></script>
</body>
</html>
